name: Game V1 and MySQL baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: games/interviewer-eye-opener/web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: games/interviewer-eye-opener/web/.node-version
          cache: npm
          cache-dependency-path: games/interviewer-eye-opener/web/package-lock.json

      - name: Install locked browser game dependencies
        run: npm ci

      - name: Check game rules
        run: npm test

      - name: Build the browser game
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Play complete browser journeys
        run: npm run test:e2e

      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interviewer-eye-opener-v1-${{ github.run_id }}
          path: |
            games/interviewer-eye-opener/web/test-results/evidence/
            games/interviewer-eye-opener/web/test-results/raw/
            games/interviewer-eye-opener/web/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  qualify:
    needs: game
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: games/interviewer-eye-opener/pom.xml

      - name: Replay S0-S6 against MySQL
        run: mvn --batch-mode --no-transfer-progress -f games/interviewer-eye-opener/pom.xml verify

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mysql-baseline-s0-s6-${{ github.run_id }}
          path: games/interviewer-eye-opener/target/qualification/
          if-no-files-found: warn
          retention-days: 14
