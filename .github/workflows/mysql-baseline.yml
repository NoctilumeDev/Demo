name: MySQL baseline S0-S6

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: games/interviewer-eye-opener/pom.xml

      - name: Replay S0-S6 against MySQL
        run: mvn --batch-mode --no-transfer-progress -f games/interviewer-eye-opener/pom.xml verify

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mysql-baseline-s0-s6-${{ github.run_id }}
          path: games/interviewer-eye-opener/target/qualification/
          if-no-files-found: warn
          retention-days: 14
